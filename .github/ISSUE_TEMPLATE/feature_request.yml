name: Feature request
description: Propose a focused improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What concrete task is difficult with the current kit?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and its expected outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Include any impact on interruptions, review cost or compatibility.
